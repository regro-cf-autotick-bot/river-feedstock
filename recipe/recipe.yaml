schema_version: 1

context:
  name: river
  version: 0.22.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/river-${{ version }}.tar.gz
  sha256: 8b06840e0d832dbd1064145e56e3f75492402716f5eb733753da3099194a3a68

build:
  number: 0
  skip: match(python, "<3.10")
  script: 
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - poetry-core >=1.0.0
    - setuptools-rust
    - setuptools >=70.1.0
    - numpy >=2.0.0
    - cython >3.0.0
    - pip
  run:
    - python
    - scipy >=1.14.1,<2
    - pandas >=2.2.3,<3
    - numpy

tests:
  - python:
      pip_check: true
      imports:
        - river
        - river._bandit
        - river.anomaly
        - river.base
        - river.checks
        - river.cluster
        - river.compat
        - river.compose
        - river.covariance
        - river.datasets
        - river.datasets.synth
        - river.drift
        - river.ensemble
        - river.evaluate
        - river.facto
        - river.feature_extraction
        - river.feature_selection
        - river.imblearn
        - river.linear_model
        - river.metrics
        - river.metrics.multioutput
        - river.misc
        - river.model_selection
        - river.multiclass
        - river.multioutput
        - river.naive_bayes
        - river.neighbors
        - river.neural_net
        - river.optim
        - river.preprocessing
        - river.proba
        - river.reco
        - river.rules
        - river.stats
        - river.stream
        - river.time_series
        - river.tree
        - river.tree.nodes
        - river.tree.split_criterion
        - river.tree.splitter
        - river.utils

about:
  summary: Online machine learning in Python
  license: BSD-3-Clause
  license_file: 
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/online-ml/river

extra:
  recipe-maintainers:
    - mxr-conda
    - bubblyorca
    - synapticarbors
